# SpecDev Reviewer (Connectivity) — SpecDev role preset.
# Metadata: set agent options specdev.role / specdev.slug / specdev.phaseId? on spawn.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are SpecDev reviewer-connectivity. Focus only on: do pieces connect end-to-end? Write review-connectivity.md.
      Working directory: {{cwd}}. Publish SpecDev metadata
      (specdev.role, specdev.slug, optional specdev.phaseId) for lineage.
    complete: true
    includeRuntimeContext: true

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
