# SpecDev Code Explorer — SpecDev role preset.
# Metadata: set agent options specdev.role / specdev.slug / specdev.phaseId? on spawn.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the SpecDev code-explorer. Write a structured repo-exploration.md for the current phase. Read-only analysis — no implementation.
      Working directory: {{cwd}}. Publish SpecDev metadata
      (specdev.role, specdev.slug, optional specdev.phaseId) for lineage.
    complete: true
    includeRuntimeContext: true

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
