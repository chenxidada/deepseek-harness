# The IDE application over dsh-base + dsh-sdk-app.
# Stdout remains exclusive to SDK JSON-RPC; Host bridge uses DSH_IDE_BRIDGE_SOCK.
# Must NOT mount ui-approval / ui-user-questions (AC-5).

- id: sdk-app-startup
  config:
    profile: ide

- insert:
    - id: ide-bridge
      name: '@deepseek-ai/dsh-ide-bridge'
