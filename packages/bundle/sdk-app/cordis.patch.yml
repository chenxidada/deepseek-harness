# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: session-title-llm
  disabled: true

# SpecDev owns Spec `/plan` as a SpecDev command. Keep native plan-mode off
# for the sdk SpecDev composition so the two do not collide (web-app precedent:
# disable by base row id).
- id: plan-mode
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

    # SpecDev runtime (Phase 1) + commands / presets (Phase 2).
    - id: specdev
      name: '@deepseek-ai/dsh-specdev'

    - id: specdev-presets
      name: '@deepseek-ai/dsh-specdev-presets'

    # sdk is rosterless by default; SpecDev model A needs agent-presets with
    # the SpecDev preset root (and Orchestrator as default).
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      inject: [specdevPresets]
      config:
        default: specdev-orchestrator
        includeShippedRoot: false
        includeUserRoot: false
        roots:
          - path: !!js specdevPresets.presetRoot
            trust: system

    - id: command-specdev
      name: '@deepseek-ai/dsh-command-specdev'
      inject: [specdev, commands]
