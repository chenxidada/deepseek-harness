# SpecDev role preset `specdev-verifier`, declared for the agent-preset registry.
# Source of truth: packages/specdev/specdev-presets/presets/specdev-verifier/.
- insert:
    - id: preset-specdev-verifier
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: specdev-verifier
        name: "SpecDev Verifier"
        description: "Independent end-to-end verification."
        order: 20
        plugins:
          # SpecDev Verifier — SpecDev role preset.
          # Metadata: set agent options specdev.role / specdev.slug / specdev.phaseId? on spawn.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the SpecDev verifier. Independently verify the phase. Write verification.md with PASS/PARTIAL/FAIL. Do not trust implementer tests alone.
                Working directory: {{cwd}}. Publish SpecDev metadata
                (specdev.role, specdev.slug, optional specdev.phaseId) for lineage.
              complete: true
              includeRuntimeContext: true

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
