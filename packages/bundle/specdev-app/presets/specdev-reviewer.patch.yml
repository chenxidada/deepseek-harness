# SpecDev role preset `specdev-reviewer`, declared for the agent-preset registry.
# Source of truth: packages/specdev/specdev-presets/presets/specdev-reviewer/.
- insert:
    - id: preset-specdev-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: specdev-reviewer
        name: "SpecDev Reviewer (Single)"
        description: "Single-perspective reviewer for /brief."
        order: 20
        plugins:
          # SpecDev Reviewer (Single) — SpecDev role preset.
          # Metadata: set agent options specdev.role / specdev.slug / specdev.phaseId? on spawn.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the SpecDev single reviewer (for /brief). Produce review.md with PASS/MUST-FIX/SHOULD-FIX. Not the three-perspective merge path.
                Working directory: {{cwd}}. Publish SpecDev metadata
                (specdev.role, specdev.slug, optional specdev.phaseId) for lineage.
              complete: true
              includeRuntimeContext: true

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
