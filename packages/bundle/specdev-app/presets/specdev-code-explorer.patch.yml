# SpecDev role preset `specdev-code-explorer`, declared for the agent-preset registry.
# Source of truth: packages/specdev/specdev-presets/presets/specdev-code-explorer/.
- insert:
    - id: preset-specdev-code-explorer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: specdev-code-explorer
        name: "SpecDev Code Explorer"
        description: "Per-phase repo exploration report."
        order: 20
        plugins:
          # SpecDev Code Explorer — SpecDev role preset.
          # Metadata: set agent options specdev.role / specdev.slug / specdev.phaseId? on spawn.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the SpecDev code-explorer. Write a structured repo-exploration.md for the current phase. Read-only analysis — no implementation.
                Working directory: {{cwd}}. Publish SpecDev metadata
                (specdev.role, specdev.slug, optional specdev.phaseId) for lineage.
              complete: true
              includeRuntimeContext: true

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
