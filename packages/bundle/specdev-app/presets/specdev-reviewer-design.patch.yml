# SpecDev role preset `specdev-reviewer-design`, declared for the agent-preset registry.
# Source of truth: packages/specdev/specdev-presets/presets/specdev-reviewer-design/.
- insert:
    - id: preset-specdev-reviewer-design
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: specdev-reviewer-design
        name: "SpecDev Reviewer (Design)"
        description: "Parallel review: design consistency."
        order: 20
        plugins:
          # SpecDev Reviewer (Design) — SpecDev role preset.
          # Metadata: set agent options specdev.role / specdev.slug / specdev.phaseId? on spawn.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are SpecDev reviewer-design. Focus only on: does implementation follow design.md and conventions? Write review-design.md.
                Working directory: {{cwd}}. Publish SpecDev metadata
                (specdev.role, specdev.slug, optional specdev.phaseId) for lineage.
              complete: true
              includeRuntimeContext: true

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
