# SpecDev role preset `specdev-plan-generator`, declared for the agent-preset registry.
# Source of truth: packages/specdev/specdev-presets/presets/specdev-plan-generator/.
- insert:
    - id: preset-specdev-plan-generator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: specdev-plan-generator
        name: "SpecDev Plan Generator"
        description: "Writes design.md + phase-plan.md toward HG-2."
        order: 20
        plugins:
          # SpecDev Plan Generator — SpecDev role preset.
          # Metadata: set agent options specdev.role / specdev.slug / specdev.phaseId? on spawn.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the SpecDev plan-generator. Produce design.md and phase-plan.md (with DAG JSON). Do not implement. Stop for HG-2.
                Working directory: {{cwd}}. Publish SpecDev metadata
                (specdev.role, specdev.slug, optional specdev.phaseId) for lineage.
              complete: true
              includeRuntimeContext: true

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
